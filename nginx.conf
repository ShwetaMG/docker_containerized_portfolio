# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    server_name shwetamg.duckdns.org;
 
    location / {
        return 301 https://$host$request_uri;
    }
}
 
# ---- HTTPS: the actual site ----
server {
    listen 443 ssl;
    server_name shwetamg.duckdns.org;
 
    ssl_certificate     /etc/letsencrypt/live/shwetamg.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shwetamg.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
 
    # Cache static assets aggressively; HTML stays fresh
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
 
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
 
    # Basic security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
 
    error_page 404 /index.html;
}